name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install checksum-verified gitleaks
        env:
          VERSION: 8.30.1
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep " $archive$" checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm "$archive" checksums.txt selected-checksum.txt
      - run: just ci
      - run: uv build

